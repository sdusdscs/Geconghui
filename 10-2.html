<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSS 幻灯片</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #222;
    font-family: "Microsoft YaHei", sans-serif;
  }

  .slider {
    width: 600px;
    height: 400px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
  }

  .slider img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 100%;
    animation: slide 9s infinite ease-in-out;
  }

  .slider img:nth-child(1) { animation-delay: 0s;   }
  .slider img:nth-child(2) { animation-delay: 3s;   }
  .slider img:nth-child(3) { animation-delay: 6s;   }

  @keyframes slide {
    0%   { left: 100%; }
    5%   { left: 0;    }
    28%  { left: 0;    }
    33%  { left: -100%; }
    100% { left: -100%; }
  }

  .caption {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 10px 28px;
    font-size: 20px;
    letter-spacing: 4px;
    border-radius: 6px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="slider">
    <img src="img/4.jpg" alt="slide 1">
    <img src="img/5.jpg" alt="slide 2">
    <img src="img/6.jpg" alt="slide 3">
    <div class="caption">葛聪慧</div>
  </div>
</body>
</html>
