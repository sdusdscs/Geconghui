  <header class="Ge_hero">
    <h1>JavaScript 主要数组方法</h1>
    <p>每个方法都用「调用前的原数组 &rarr; 调用后的结果」的方块图直观展示，颜色标出新增、修改、删除与命中的元素</p>

  <main class="Ge_wrap">

    <h2 class="Ge_sectionTitle">一、交互实验室：亲手操作数组</h2>
    <section class="Ge_lab">
      <div class="Ge_labStage" id="Ge_labStage"></div>

      <div class="Ge_labBar">
        <input class="Ge_input" id="Ge_input" placeholder="输入值，如 66">
        <button class="Ge_btn" data-act="unshift">unshift 头部添加</button>
        <button class="Ge_btn" data-act="push">push 尾部添加</button>
        <button class="Ge_btn Ge_warn" data-act="shift">shift 头部删除</button>
        <button class="Ge_btn Ge_warn" data-act="pop">pop 尾部删除</button>

    <h2 class="Ge_sectionTitle">二、方法对照表：点「▶ 运行」看动画</h2>
    <div class="Ge_tabs" id="Ge_tabs"></div>

  <script>
    var Ge_base = [10, 5, 40, 25, 8];

    /* ---------- 工具函数 ---------- */
    function Ge_str(v) {
      if (Array.isArray(v)) return "[" + v.map(Ge_str).join(", ") + "]";
      if (typeof v === "string") return '"' + v + '"';
      return String(v);
    }

    function Ge_boxText(v) {
      if (Array.isArray(v)) return "[" + v.map(Ge_boxText).join(",") + "]";
      return String(v);
    }

    function Ge_typeOf(v) {
      if (Array.isArray(v)) return "array";
      return typeof v;
    }

    function Ge_boxes(list, mark) {
      var html = "";
      if (!list.length) return '<div class="Ge_empty">空数组 [ ]</div>';
      for (var i = 0; i < list.length; i++) {
        var cls = "Ge_box";
        if (mark.add && mark.add.indexOf(i) !== -1) cls += " Ge_add";
        if (mark.mod && mark.mod.indexOf(i) !== -1) cls += " Ge_mod";
        if (mark.del && mark.del.indexOf(i) !== -1) cls += " Ge_del";
        if (mark.hit && mark.hit.indexOf(i) !== -1) cls += " Ge_hit";
        html += '<div class="Ge_cell" style="animation-delay:' + (i * 0.06).toFixed(2) + 's">'
              + '<div class="' + cls + '">' + Ge_boxText(list[i]) + '</div>'
              + '<span class="Ge_idx">[' + i + ']</span>'
              + '</div>';
      }
      return html;
    }

    /* ---------- 22 个数组方法定义 ---------- */
    var Ge_methods = [
      {
        name: "push()", cat: "增删", mut: true,
        desc: "在数组末尾追加一个或多个元素，改变原数组，返回追加后的新长度。",
        code: "Ge_arr.push(60, 70);",
        add: [5, 6],
        run: function (a) { return { arr: a, v: a.push(60, 70) }; }
      },
      {
        name: "pop()", cat: "增删", mut: true,
        desc: "删除并返回数组的最后一个元素，数组长度减 1（栈的“出栈”）。",
        code: "Ge_arr.pop();",
        del: [4],
        run: function (a) { return { arr: a, v: a.pop() }; }
      },
      {
        name: "unshift()", cat: "增删", mut: true,
        desc: "在数组开头插入一个或多个元素，其余元素依次后移，返回新长度。",
        code: "Ge_arr.unshift(0);",
        add: [0],
        run: function (a) { return { arr: a, v: a.unshift(0) }; }
      },
      {
        name: "shift()", cat: "增删", mut: true,
        desc: "删除并返回数组的第一个元素，其余元素依次前移（队列的“出队”）。",
        code: "Ge_arr.shift();",
        del: [0],
        run: function (a) { return { arr: a, v: a.shift() }; }
      },
      {
        name: "splice()", cat: "增删", mut: true,
        desc: "万能增删改：从指定位置删除若干元素，并可在该位置插入新元素，返回被删除的元素组成的数组。",
        code: 'Ge_arr.splice(1, 2, "A", "B");\n// 从索引1开始删2个，再插入 A、B',
        del: [1, 2],
        add: [1, 2],
        run: function (a) { return { arr: a, v: a.splice(1, 2, "A", "B") }; }
      },
      {
        name: "slice()", cat: "截取拼接", mut: false,
        desc: "截取片段：返回从 start 到 end（不含 end）的新数组，原数组不变。",
        code: "Ge_arr.slice(1, 4);",
        run: function (a) { var r = a.slice(1, 4); return { arr: r, v: r }; }
      },
      {
        name: "concat()", cat: "截取拼接", mut: false,
        desc: "合并数组：把参数接到尾部生成新数组，原数组不变。",
        code: "Ge_arr.concat([100, 200]);",
        add: [5, 6],
        run: function (a) { var r = a.concat([100, 200]); return { arr: r, v: r }; }
      },
      {
        name: "join()", cat: "截取拼接", mut: false,
        desc: "把数组所有元素用指定分隔符连成一个字符串，常用于拼接 URL 或展示列表。",
        code: 'Ge_arr.join("-");',
        run: function (a) { var r = a.join("-"); return { arr: r, v: r }; }
      },
      {
        name: "indexOf()", cat: "查找判断", mut: false,
        desc: "从前往后查找元素第一次出现的位置，找不到返回 -1。",
        code: "Ge_arr.indexOf(40);",
        hit: [2],
        run: function (a) { return { arr: a, v: a.indexOf(40) }; }
      },
      {
        name: "includes()", cat: "查找判断", mut: false,
        desc: "判断数组是否包含某个元素，返回 true / false（比 indexOf 更语义化）。",
        code: "Ge_arr.includes(40);",
        hit: [2],
        run: function (a) { return { arr: a, v: a.includes(40) }; }
      },
      {
        name: "find()", cat: "查找判断", mut: false,
        desc: "返回第一个满足回调条件的元素本身，找不到返回 undefined。",
        code: "Ge_arr.find(function (n) { return n > 20; });",
        hit: [2],
        run: function (a) { return { arr: a, v: a.find(function (n) { return n > 20; }) }; }
      },
      {
        name: "findIndex()", cat: "查找判断", mut: false,
        desc: "返回第一个满足回调条件的元素的索引，找不到返回 -1。",
        code: "Ge_arr.findIndex(function (n) { return n > 20; });",
        hit: [2],
        run: function (a) { return { arr: a, v: a.findIndex(function (n) { return n > 20; }) }; }
      },
      {
        name: "some()", cat: "查找判断", mut: false,
        desc: "只要有一个元素满足条件就返回 true（找到一个即停止遍历）。",
        code: "Ge_arr.some(function (n) { return n > 30; });",
        hit: [2],
        run: function (a) { return { arr: a, v: a.some(function (n) { return n > 30; }) }; }
      },
      {
        name: "every()", cat: "查找判断", mut: false,
        desc: "要求所有元素都满足条件才返回 true（有一个不满足立即返回 false）。",
        code: "Ge_arr.every(function (n) { return n > 3; });",
        run: function (a) { return { arr: a, v: a.every(function (n) { return n > 3; }) }; }
      },
      {
        name: "forEach()", cat: "遍历转换", mut: false,
        desc: "依次把每个元素交给回调处理，没有返回值（返回 undefined），相当于简化的 for 循环。",
        code: "Ge_arr.forEach(function (n, i) {\n  Ge_log.push('第' + i + '个：' + n);\n});",
        run: function (a) {
          var Ge_out = [];
          a.forEach(function (n, i) { Ge_out.push("第 " + i + " 个 → " + n); });
          return { arr: a, v: undefined, log: Ge_out.join("  |  ") };
        }
      },
      {
        name: "map()", cat: "遍历转换", mut: false,
        desc: "把每个元素按规则加工后，返回同样长度的新数组（一对一映射）。",
        code: "Ge_arr.map(function (n) { return n * 2; });",
        mod: [0, 1, 2, 3, 4],
        run: function (a) { var r = a.map(function (n) { return n * 2; }); return { arr: r, v: r }; }
      },
      {
        name: "filter()", cat: "遍历转换", mut: false,
        desc: "筛选出满足条件的元素，返回新数组，长度通常比原数组短。",
        code: "Ge_arr.filter(function (n) { return n > 10; });",
        run: function (a) { var r = a.filter(function (n) { return n > 10; }); return { arr: r, v: r }; }
      },
      {
        name: "reduce()", cat: "遍历转换", mut: false,
        desc: "从左到右把元素“累积”成一个值（求和、求积、拼接都可以）。",
        code: "Ge_arr.reduce(function (s, n) { return s + n; }, 0);",
        run: function (a) { return { arr: a, v: a.reduce(function (s, n) { return s + n; }, 0) }; }
      },
      {
        name: "reverse()", cat: "排序重组", mut: true,
        desc: "把数组元素顺序原地颠倒，返回的是原数组本身。",
        code: "Ge_arr.reverse();",
        mod: [0, 1, 2, 3, 4],
        run: function (a) { return { arr: a, v: a.reverse() }; }
      },
      {
        name: "sort() 默认", cat: "排序重组", mut: true,
        desc: "注意：不带参数时按字符串的字典序排序，所以 10 排在了 5 的前面。",
        code: "Ge_arr.sort();",
        mod: [0, 1, 2, 3, 4],
        run: function (a) { return { arr: a, v: a.sort() }; }
      },
      {
        name: "sort(比较函数)", cat: "排序重组", mut: true,
        desc: "传入比较函数才能真正按数值排序：返回值小于 0 时 a 排在 b 前面。",
        code: "Ge_arr.sort(function (a, b) { return a - b; });",
        mod: [0, 1, 2, 3, 4],
        run: function (a) { return { arr: a, v: a.sort(function (x, y) { return x - y; }) }; }
      },
      {
        name: "flat()", cat: "排序重组", mut: false,
        desc: "把嵌套的子数组“拉平”；参数表示拉平的层数，用 Infinity 可一次拉平到底。",
        before: [1, [2, 3], [4, [5]]],
        code: "Ge_arr.flat(2);",
        run: function (a) { var r = a.flat(2); return { arr: r, v: r }; }
      }
    ];

    /* ---------- 渲染卡片区 ---------- */
    var Ge_grid = document.getElementById("Ge_grid");
    var Ge_html = "";

    for (var Ge_i = 0; Ge_i < Ge_methods.length; Ge_i++) {
      var Ge_m = Ge_methods[Ge_i];
      var Ge_before = Ge_m.before ? Ge_m.before.slice() : Ge_base.slice();
      var Ge_res = Ge_m.run(Ge_before.slice());
      var Ge_mark = { add: Ge_m.add, mod: Ge_m.mod, del: Ge_m.del, hit: Ge_m.hit };
      var Ge_afterHtml = Array.isArray(Ge_res.arr)
        ? Ge_boxes(Ge_res.arr, { add: Ge_m.add, mod: Ge_m.mod, hit: Ge_m.hit })
        : '<div class="Ge_value">' + Ge_boxText(Ge_res.arr) + '</div>';

      var Ge_badge = Ge_m.mut
        ? '<span class="Ge_mut Ge_mutYes">改变原数组</span>'
        : '<span class="Ge_mut Ge_mutNo">原数组不变</span>';

      Ge_html += '<article class="Ge_card" data-cat="' + Ge_m.cat + '">'
        + '<div class="Ge_cardHead">'
        + '<span class="Ge_name">' + Ge_m.name + '</span>'
        + '<span class="Ge_cat">' + Ge_m.cat + '</span>'
        + Ge_badge
        + '</div>'
        + '<p class="Ge_desc">' + Ge_m.desc + '</p>'
        + '<div class="Ge_code">' + Ge_m.code + '</div>'
        + '<div class="Ge_stage">'
        + '<div class="Ge_rowLabel">调用前：' + Ge_str(Ge_before) + '</div>'
        + '<div class="Ge_stageRow">' + Ge_boxes(Ge_before, { del: Ge_m.del, hit: Ge_m.hit }) + '</div>'
        + '<div class="Ge_arrow">&#8681; 调用 ' + Ge_m.name + ' &#8681;</div>'
        + '<div class="Ge_rowLabel">' + (Ge_m.mut ? "调用后（原数组被改变）" : "返回值（原数组不变）") + '</div>'
        + '<div class="Ge_stageRow">' + Ge_afterHtml + '</div>'
        + '<div class="Ge_ret">返回值 &rarr; <b>' + Ge_str(Ge_res.v) + '</b> <span class="Ge_type">（' + Ge_typeOf(Ge_res.v) + '）</span></div>'
        + (Ge_res.log ? '<div class="Ge_ret">回调输出 &rarr; <b>' + Ge_res.log + '</b></div>' : '')
        + '</div>'
        + '<button class="Ge_run">&#9654; 运行</button>'
        + '</article>';
    }

    Ge_grid.innerHTML = Ge_html;

    var Ge_playBtns = Ge_grid.querySelectorAll(".Ge_run");
    for (var Ge_j = 0; Ge_j < Ge_playBtns.length; Ge_j++) {
      Ge_playBtns[Ge_j].onclick = function () {
        var Ge_stage = this.parentNode.querySelector(".Ge_stage");
        Ge_stage.classList.remove("Ge_play");
        void Ge_stage.offsetWidth;
        Ge_stage.classList.add("Ge_play");
      };
    }

    /* ---------- 分类标签页 ---------- */
    var Ge_tabsBox = document.getElementById("Ge_tabs");
    var Ge_cats = ["全部"];
    for (var Ge_k = 0; Ge_k < Ge_methods.length; Ge_k++) {
      if (Ge_cats.indexOf(Ge_methods[Ge_k].cat) === -1) Ge_cats.push(Ge_methods[Ge_k].cat);
    }

    var Ge_tabHtml = "";
    for (var Ge_c = 0; Ge_c < Ge_cats.length; Ge_c++) {
      Ge_tabHtml += '<button class="Ge_tab' + (Ge_c === 0 ? " Ge_tabOn" : "") + '" data-cat="' + Ge_cats[Ge_c] + '">'
        + Ge_cats[Ge_c] + '</button>';
    }
    Ge_tabHtml += '<button class="Ge_playAll" id="Ge_playAll">&#9654; 全部播放动画</button>';
    Ge_tabsBox.innerHTML = Ge_tabHtml;

    var Ge_tabBtns = Ge_tabsBox.querySelectorAll(".Ge_tab");
    var Ge_cards = Ge_grid.querySelectorAll(".Ge_card");

    for (var Ge_t = 0; Ge_t < Ge_tabBtns.length; Ge_t++) {
      Ge_tabBtns[Ge_t].onclick = function () {
        for (var Ge_a = 0; Ge_a < Ge_tabBtns.length; Ge_a++) Ge_tabBtns[Ge_a].classList.remove("Ge_tabOn");
        this.classList.add("Ge_tabOn");
        var Ge_cur = this.getAttribute("data-cat");
        for (var Ge_b = 0; Ge_b < Ge_cards.length; Ge_b++) {
          var Ge_card = Ge_cards[Ge_b];
          if (Ge_cur === "全部" || Ge_card.getAttribute("data-cat") === Ge_cur) {
            Ge_card.classList.remove("Ge_hide");
          } else {
            Ge_card.classList.add("Ge_hide");
          }
        }
      };
    }

    document.getElementById("Ge_playAll").onclick = function () {
      for (var Ge_p = 0; Ge_p < Ge_playBtns.length; Ge_p++) Ge_playBtns[Ge_p].onclick.call(Ge_playBtns[Ge_p]);
    };

    /* ---------- 交互实验室 ---------- */
    var Ge_labStage = document.getElementById("Ge_labStage");
    var Ge_labLog = document.getElementById("Ge_labLog");
    var Ge_input = document.getElementById("Ge_input");
    var Ge_lenTip = document.getElementById("Ge_lenTip");
    var Ge_lab = Ge_base.slice();
    var Ge_flash = { add: [], del: [] };

    function Ge_draw() {
      var html = "";
      for (var i = 0; i < Ge_lab.length; i++) {
        var cls = "Ge_box";
        if (Ge_flash.add.indexOf(i) !== -1) cls += " Ge_add";
        if (Ge_flash.del.indexOf(i) !== -1) cls += " Ge_del";
        html += '<div class="Ge_cell" style="animation-delay:' + (i * 0.05).toFixed(2) + 's">'
          + '<div class="' + cls + '">' + Ge_boxText(Ge_lab[i]) + '</div>'
          + '<span class="Ge_idx">[' + i + ']</span>'
          + '</div>';
      }
      if (!Ge_lab.length) html = '<div class="Ge_empty">空数组 [ ] &nbsp; 可以点「重置演示数组」恢复</div>';
      Ge_labStage.innerHTML = html;
      Ge_lenTip.textContent = "当前数组：" + Ge_str(Ge_lab) + "，length = " + Ge_lab.length;

      Ge_labStage.classList.remove("Ge_play");
      void Ge_labStage.offsetWidth;
      Ge_labStage.classList.add("Ge_play");
    }

    function Ge_writeLog(code, ret, arr) {
      var row = document.createElement("div");
      row.className = "Ge_logRow";
      row.innerHTML = '<span class="Ge_logCode">' + code + '</span> &nbsp;→&nbsp; '
        + '<span class="Ge_logRet">返回值：' + Ge_str(ret) + '</span> &nbsp;|&nbsp; '
        + '<span class="Ge_logArr">当前数组：' + Ge_str(arr) + '</span>';
      Ge_labLog.insertBefore(row, Ge_labLog.firstChild);
    }

    var Ge_labBtns = document.querySelectorAll(".Ge_labBar .Ge_btn");
    for (var Ge_b2 = 0; Ge_b2 < Ge_labBtns.length; Ge_b2++) {
      Ge_labBtns[Ge_b2].onclick = function () {
        var act = this.getAttribute("data-act");
        var ret = null;
        var code = "";
        var raw = Ge_input.value.trim();
        var val = raw === "" ? null : (isNaN(raw) ? raw : Number(raw));

        if (act === "push") {
          if (val === null) { Ge_input.focus(); return; }
          code = "Ge_arr.push(" + Ge_str(val) + ")";
          ret = Ge_lab.push(val);
          Ge_flash = { add: [Ge_lab.length - 1], del: [] };
        } else if (act === "unshift") {
          if (val === null) { Ge_input.focus(); return; }
          code = "Ge_arr.unshift(" + Ge_str(val) + ")";
          ret = Ge_lab.unshift(val);
          Ge_flash = { add: [0], del: [] };
        } else if (act === "pop") {
          code = "Ge_arr.pop()";
          if (!Ge_lab.length) { Ge_flash = { add: [], del: [] }; Ge_draw(); return; }
          ret = Ge_lab.pop();
          Ge_flash = { add: [], del: [] };
        } else if (act === "shift") {
          code = "Ge_arr.shift()";
          if (!Ge_lab.length) { Ge_flash = { add: [], del: [] }; Ge_draw(); return; }
          ret = Ge_lab.shift();
          Ge_flash = { add: [], del: [] };
        } else if (act === "sort") {
          code = "Ge_arr.sort(function(a,b){ return a-b; })";
          ret = Ge_lab.sort(function (a, b) { return a - b; });
          Ge_flash = { add: [], del: [] };
        } else if (act === "reverse") {
          code = "Ge_arr.reverse()";
          ret = Ge_lab.reverse();
          Ge_flash = { add: [], del: [] };
        } else if (act === "clear") {
          code = "Ge_arr.length = 0";
          Ge_lab.length = 0;
          ret = undefined;
          Ge_flash = { add: [], del: [] };
        } else {
          code = "Ge_arr = [10, 5, 40, 25, 8]";
          Ge_lab = Ge_base.slice();
          ret = Ge_lab.length;
          Ge_flash = { add: [], del: [] };
        }

        Ge_draw();
        Ge_writeLog(code, ret, Ge_lab);
        Ge_input.value = "";
      };
    }

    Ge_draw();
    Ge_writeLog("Ge_arr = [10, 5, 40, 25, 8]", "初始化完成", Ge_lab);
  </script>
</body>
</html>
